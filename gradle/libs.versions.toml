[versions]
agp = "9.1.1"
kotlin = "2.4.10"
android-compileSdk = "37"
# Fire OS 6 is API 25, Fire OS 7 is API 28.
android-minSdk = "25"
android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-annotation = "1.11.0"
androidx-core = "1.19.1"
androidx-lifecycle = "2.11.0"
compose-bom = "2026.09.00"
checker-qual = "4.3.1"
junit = "4.13.2"
kotlinx-coroutines = "1.11.0"
media3 = "1.11.1"
tv-material = "1.1.0"
zxing = "3.5.4"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui = { module = "androidx.compose.ui:ui" }
junit = { module = "junit:junit", version.ref = "junit" }
checker-qual = { module = "org.checkerframework:checker-qual", version.ref = "checker-qual" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
media3-decoder = { module = "androidx.media3:media3-decoder", version.ref = "media3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
tv-material = { module = "androidx.tv:tv-material", version.ref = "tv-material" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
